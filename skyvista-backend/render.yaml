databases:
  - name: skyvista-db
    plan: free
    databaseName: skyvista_db
    user: skyvista_user

services:
  - type: web
    name: skyvista-backend
    runtime: python
    plan: free
    rootDir: skyvista-backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skyvista-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: skyvista-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://skyvista-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://skyvista-backend.onrender.com
      - key: PYTHON_VERSION
        value: 3.12.0

  - type: web
    name: skyvista-frontend
    runtime: static
    rootDir: skyvista-frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://skyvista-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
